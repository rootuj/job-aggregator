[project]
name = "job-agent"
version = "0.1.0"
description = "Finds companies, collects their open jobs, and matches them against a resume."
readme = "README.md"
authors = [
    { name = "Rootu Joshi", email = "4442296+rootuj@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
job-agent = "job_agent:main"
job-agent-mcp = "job_agent.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
